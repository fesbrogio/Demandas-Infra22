name: Notificar eventos por Telegram

on:
  # Roda todo dia às 06:33 UTC = 03:33 em Ribeirão Preto (Brasil não usa mais
  # horário de verão desde 2019, então esse horário fica fixo o ano todo).
  # PALIATIVO: adiantamos bastante o horário porque o agendador do GitHub
  # Actions tem mostrado atrasos de 3 a 6 horas consistentemente (não é mais
  # só o "atraso ocasional" da documentação) — rodar de madrugada dá margem
  # pro aviso ainda chegar antes do expediente começar, mesmo com atraso.
  # Isso é uma medida provisória; o plano é migrar para um disparo externo
  # (via cron-job.org chamando a API do GitHub) para ter horário confiável.
  schedule:
    - cron: "33 6 * * *"
  # Permite rodar manualmente pela aba "Actions" do GitHub, útil para testar.
  workflow_dispatch: {}

# Necessário para o passo de "manutenção" abaixo, que faz um commit leve
# só para o GitHub não desativar este agendamento por inatividade do repositório
# (GitHub desativa workflows agendados após 60 dias sem nenhum commit).
permissions:
  contents: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar eventos de amanhã e enviar avisos no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/notificar-telegram.mjs

      - name: Manter o workflow agendado ativo
        run: |
          mkdir -p .github/keepalive
          echo "Última verificação: $(date -u '+%Y-%m-%d %H:%M UTC')" > .github/keepalive/ultima-execucao.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive/ultima-execucao.txt
          git diff --staged --quiet || git commit -m "chore: manter workflow agendado ativo"
          git push
