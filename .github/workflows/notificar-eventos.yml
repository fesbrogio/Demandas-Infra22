name: Notificar eventos por Telegram

on:
  # Roda todo dia às 05:30 UTC = 02:30 em Ribeirão Preto (Brasil não usa mais
  # horário de verão desde 2019, então esse horário fica fixo o ano todo).
  # PALIATIVO: mesmo depois de ajustar o minuto pra sair do topo da hora, o
  # agendador do GitHub Actions continuou atrasando de forma inconsistente
  # (visto em testes reais). Rodar de madrugada, bem mais cedo, é a forma de
  # dar a maior margem possível pro aviso ainda chegar antes do expediente,
  # mesmo com atraso. Isso não resolve a causa raiz — só reduz o estrago dela.
  # A correção definitiva é migrar para um disparo externo (cron-job.org
  # chamando a API do GitHub), que fica pendente até haver tempo pra configurar.
  schedule:
    - cron: "30 5 * * *"
  # Permite rodar manualmente pela aba "Actions" do GitHub, útil para testar.
  workflow_dispatch: {}

# Necessário para o passo de "manutenção" abaixo, que faz um commit leve
# só para o GitHub não desativar este agendamento por inatividade do repositório
# (GitHub desativa workflows agendados após 60 dias sem nenhum commit).
permissions:
  contents: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar eventos de amanhã e enviar avisos no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/notificar-telegram.mjs

      - name: Manter o workflow agendado ativo
        run: |
          mkdir -p .github/keepalive
          echo "Última verificação: $(date -u '+%Y-%m-%d %H:%M UTC')" > .github/keepalive/ultima-execucao.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive/ultima-execucao.txt
          git diff --staged --quiet || git commit -m "chore: manter workflow agendado ativo"
          git push
