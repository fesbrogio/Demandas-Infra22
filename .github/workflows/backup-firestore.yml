name: Backup semanal do Firestore

on:
  schedule:
    # Todo domingo às 03:17 de Ribeirão Preto (06:17 UTC)
    - cron: '17 6 * * 0'
  workflow_dispatch: # permite rodar manualmente pelo botão "Run workflow"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar dados do Firestore
        run: node backup-firestore.mjs

      - name: Data do backup
        id: data
        run: echo "hoje=$(TZ=America/Sao_Paulo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Guardar backup (fica 90 dias na aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: backup-firestore-${{ steps.data.outputs.hoje }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
